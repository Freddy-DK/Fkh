name: Contract Tests

on:
  pull_request:
    paths:
      - 'ContainerScripts/**'
      - 'fkh-backend/**'
      - 'fkh-cli/**'
      - 'tests/Fkh.Contract.Tests/**'
      - '.github/workflows/ContractTests.yml'
  push:
    branches: [main]
    paths:
      - 'ContainerScripts/**'
      - 'fkh-backend/**'
      - 'fkh-cli/**'
      - 'tests/Fkh.Contract.Tests/**'
      - '.github/workflows/ContractTests.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run contract tests
        run: dotnet test tests/Fkh.Contract.Tests/Fkh.Contract.Tests.csproj --configuration Release
