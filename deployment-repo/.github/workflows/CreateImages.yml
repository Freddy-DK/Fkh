# ============================================================================
# Create Images – Caller workflow for the Fkh reusable workflow
# ============================================================================
# Builds and pushes Business Central Docker images to ACR.
# Use this if you want image builds to run privately (paid runners).
# Alternatively, run the CreateImages workflow directly in your public Fkh fork.
#
# ── Required GitHub Secrets ─────────────────────────────────────────────────
#   AZURE_CLIENT_ID        - Client ID of the managed identity (synced by Deploy Full Stack)
#   AZURE_TENANT_ID        - Azure AD tenant ID (synced by Deploy Full Stack)
#   AZURE_SUBSCRIPTION_ID  - Azure subscription ID (synced by Deploy Full Stack)
#   ACR_LOGIN_SERVER       - ACR login server (synced by Deploy Full Stack)
#   DBS_STORAGE_ACCOUNT    - Database storage account (synced by Deploy Full Stack)
# ============================================================================

name: Create Images

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      artifactUrls:
        description: 'Comma-separated list of artifact URLs'
        required: true
        type: string

jobs:
  prepare:
    runs-on: windows-2022
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Prepare matrix
        id: prepare
        uses: Freddy-DK/Fkh/.github/actions/create-image-prepare@main
        with:
          artifactUrls: ${{ inputs.artifactUrls }}

  build:
    needs: prepare
    runs-on: windows-2022
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Create BC Image
        uses: Freddy-DK/Fkh/.github/actions/create-image-build@main
        with:
          artifactUrl: ${{ matrix.artifactUrl }}
          acrLoginServer: ${{ secrets.ACR_LOGIN_SERVER }}
          dbsStorageAccount: ${{ secrets.DBS_STORAGE_ACCOUNT }}
          azureClientId: ${{ secrets.AZURE_CLIENT_ID }}
          azureTenantId: ${{ secrets.AZURE_TENANT_ID }}
          azureSubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
